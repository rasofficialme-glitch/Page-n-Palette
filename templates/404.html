<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found — Page &amp; Palette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="auth-page">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1.5rem;text-align:center;padding:2rem;">
    <div style="font-size:4rem;">🔍</div>
    <h1 style="font-family:var(--font-display);color:var(--maroon);font-size:2.2rem;margin:0;">
      404 — Page Not Found
    </h1>
    <p style="color:var(--text-muted);max-width:440px;margin:0;line-height:1.6;">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn-primary" style="text-decoration:none;display:inline-block;margin-top:1rem;">
      ← Back to Home
    </a>
  </div>
</body>
</html>
